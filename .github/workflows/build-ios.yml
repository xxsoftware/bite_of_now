name: Build iOS

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
      sign_app:
        description: 'Sign app with Apple Developer certificate'
        required: true
        default: false
        type: boolean
      build_unsigned_ipa:
        description: 'Build IPA with free Apple ID (auto-sign or SideStore fallback)'
        required: true
        default: false
        type: boolean

env:
  NODE_VERSION: 22
  RUST_VERSION: stable

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0'

      - name: Install dependencies
        run: pnpm install

      # --- Apple Developer Signing (paid certificate) ---
      # To sign and export IPA with a paid Apple Developer account, add these secrets:
      #   - IOS_CERTIFICATE_BASE64: Base64-encoded .p12 certificate
      #   - IOS_CERTIFICATE_PASSWORD: Password for the .p12
      #   - IOS_PROVISIONING_PROFILE_BASE64: Base64-encoded .mobileprovision
      #   - IOS_TEAM_ID: Apple Developer Team ID
      #
      # Then enable the "Sign app" option when running the workflow.
      #
      # --- Free Apple ID Signing (no paid certificate) ---
      # Enable "Build unsigned IPA for device" to use free Apple ID signing.
      # Optional but recommended secrets (for automatic signing on CI):
      #   - APPLE_ID: Your Apple ID email
      #   - APPLE_APP_SPECIFIC_PASSWORD: App-specific password from appleid.apple.com
      #   - APPLE_TEAM_ID: Your Personal Team ID (10 chars, find in Xcode or developer.apple.com)
      #
      # If Apple ID secrets are NOT provided, it falls back to unsigned build.
      # Unsigned IPA can be signed later with SideStore / AltStore on your device.
      #
      # NOTE: Xcode 15+ on headless CI often fails at auto-signing.
      # The most reliable path is: build on a real Mac once, export cert/profile to secrets.

      - name: Setup signing certificate
        if: inputs.sign_app
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ]; then
            echo "IOS_CERTIFICATE_BASE64 secret is not set. Skipping signing."
            exit 1
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Setup provisioning profile
        if: inputs.sign_app
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 secret is not set. Skipping provisioning."
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # --- Build ---

      - name: Init iOS project
        run: |
          # Tauri iOS init requires accepting the Xcode license
          sudo xcodebuild -license accept || true
          cargo tauri ios init

      - name: Build iOS app (unsigned simulator)
        if: ${{ !inputs.sign_app && !inputs.build_unsigned_ipa }}
        run: |
          # Build for simulator (no signing required)
          cargo tauri ios build --target aarch64-sim

      - name: Build iOS app (free Apple ID signing)
        if: ${{ inputs.build_unsigned_ipa }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # ---- Step 1: Tauri compile Rust + generate Xcode project ----
          cargo tauri ios build --target aarch64 --release || true
          # Pre-compile Rust static lib (for Xcode direct linking)
          cargo build -p bite-of-now --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release --lib

          cd src-tauri/gen/apple

          # ---- Step 2: Find Xcode project ----
          echo "=== gen/apple directory contents ==="
          ls -la
          echo "=== Finding .xcodeproj ==="
          find . -maxdepth 3 -name "*.xcodeproj" -type d

          PROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::No .xcodeproj found in gen/apple/"
            exit 1
          fi
          PROJECT=$(basename "$PROJECT_PATH")
          echo "Found project: $PROJECT at $PROJECT_PATH"

          PBXPROJ=$(find "$PROJECT_PATH" -name "project.pbxproj" | head -n 1)
          echo "project.pbxproj: $PBXPROJ"
          if [ -z "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found inside $PROJECT_PATH"
            echo "=== $PROJECT_PATH contents ==="
            ls -la "$PROJECT_PATH/"
            exit 1
          fi

          # Copy Rust static lib as libapp.a
          SRC_TAURI_DIR=$(cd ../.. && pwd)
          LIB_SRC="$SRC_TAURI_DIR/target/aarch64-apple-ios/release/libbite_of_now_lib.a"
          if [ ! -f "$LIB_SRC" ]; then
            echo "::error::Missing Rust static lib at $LIB_SRC"
            exit 1
          fi
          mkdir -p Externals/arm64/debug Externals/arm64/release
          cp "$LIB_SRC" Externals/arm64/debug/libapp.a
          cp "$LIB_SRC" Externals/arm64/release/libapp.a

          SCHEME=$(xcodebuild -project "$PROJECT_PATH" -list 2>/dev/null | awk '/Schemes:/{getline; print}' | xargs)
          echo "Scheme: $SCHEME"

          # ---- Step 3: Patch "Build Rust Code" script to no-op ----
          echo "Patching project.pbxproj to skip Rust build phase..."
          export PBXPROJ="$PBXPROJ"
          python3 << 'PYEOF'
          import os
          pbxproj_path = os.environ.get("PBXPROJ")
          if not pbxproj_path or not os.path.exists(pbxproj_path):
              raise SystemExit(f"PBXPROJ env var is missing or path does not exist: {pbxproj_path}")
          with open(pbxproj_path, "r") as f:
              content = f.read()
          lines = content.split("\n")
          in_rust_phase = False
          for i, line in enumerate(lines):
              if "/* Build Rust Code */" in line:
                  in_rust_phase = True
              if in_rust_phase and "shellScript =" in line:
                  indent = len(line) - len(line.lstrip())
                  lines[i] = " " * indent + 'shellScript = "echo \\"Rust already compiled in CI\\"\\n";'
                  in_rust_phase = False
                  break
          with open(pbxproj_path, "w") as f:
              f.write("\n".join(lines))
          print(f"Build Rust Code patched to no-op: {pbxproj_path}")
          PYEOF

          # ---- Step 4: Force disable code signing ----
          echo "Disabling code signing in project file..."
          sed -i.bak \
            -e 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' \
            -e 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            -e 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = ""/g' \
            "$PBXPROJ"
          echo "Code signing disabled."

          # ---- Step 5: Try Apple ID auto-signing (if secrets exist) ----
          AUTO_SIGN_FAILED=""
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Apple ID secrets found. Attempting automatic signing with Personal Team..."

            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
            security create-keychain -p "" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            sed -i.bak \
              -e 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' \
              -e 's/CODE_SIGN_STYLE = "Manual"/CODE_SIGN_STYLE = "Automatic"/g' \
              -e 's/PROVISIONING_PROFILE_SPECIFIER = ""/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
              -e 's/CODE_SIGN_IDENTITY = ""/CODE_SIGN_IDENTITY = "Apple Development"/g' \
              -e "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" \
              "$PBXPROJ"

            PATH="$PATH:$HOME/.cargo/bin" xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_IDENTITY="Apple Development" \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID:-}" \
              ENABLE_BITCODE=NO \
              || AUTO_SIGN_FAILED=true

            if [ -z "$AUTO_SIGN_FAILED" ]; then
              APP_PATH=$(find "$RUNNER_TEMP/derived" -name "*.app" -maxdepth 5 2>/dev/null | head -n 1)
            fi
          else
            echo "No APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD secrets found."
            echo "Get an app-specific password at: https://appleid.apple.com/account/manage"
            echo "Then add it to GitHub repo Settings > Secrets > Actions."
          fi

          # ---- Step 6: Fallback to unsigned build ----
          if [ -z "$APP_PATH" ]; then
            if [ -n "$AUTO_SIGN_FAILED" ]; then
              echo "::warning::Auto-signing failed (common on headless CI). Falling back to unsigned build..."
            else
              echo "::warning::Attempting unsigned build..."
            fi

            PATH="$PATH:$HOME/.cargo/bin" xcodebuild build \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_BITCODE=NO \
              ONLY_ACTIVE_ARCH=NO

            APP_PATH=$(find "$RUNNER_TEMP/derived" -name "*.app" -maxdepth 5 2>/dev/null | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find build -name "*.app" -maxdepth 3 2>/dev/null | head -n 1)
            fi
            UNSIGNED=true
          fi

          # ---- Step 7: Check artifact ----
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build failed. No app bundle was produced."
            echo "::error::If you have access to a Mac: build locally with Xcode + free Apple ID."
            echo "::error::Then export the certificate + provisioning profile to GitHub secrets for CI."
            exit 1
          fi

          echo "Found app: $APP_PATH"

          # ---- Step 8: Package as .ipa ----
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          if [ "$UNSIGNED" = true ]; then
            zip -r "$GITHUB_WORKSPACE/artifacts/bite-of-now-unsigned.ipa" Payload
            echo "Created unsigned IPA: artifacts/bite-of-now-unsigned.ipa"
            echo "Install with SideStore/AltStore on your device."
          else
            zip -r "$GITHUB_WORKSPACE/artifacts/bite-of-now.ipa" Payload
            echo "Created signed IPA: artifacts/bite-of-now.ipa"
            echo "Direct install (valid for ~7 days with free Apple ID)."
          fi

      - name: Build iOS app (signed)
        if: inputs.sign_app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Build for device with signing
          cargo tauri ios build --target aarch64

      # --- Export IPA (signed only) ---

      - name: Export IPA
        if: inputs.sign_app
        working-directory: src-tauri/gen/apple
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          echo "App bundle: $APP_PATH"

          ARCHIVE_PATH=$RUNNER_TEMP/bite-of-now.xcarchive
          xcodebuild -project "*.xcodeproj" \
            -scheme "bite-of-now" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" || true

          EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist
          cat > "$EXPORT_OPTIONS_PLIST" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.export_method }}</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" || true

          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -r $RUNNER_TEMP/ipa/*.ipa $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true

      - name: Collect unsigned simulator artifacts
        if: ${{ !inputs.sign_app && !inputs.build_unsigned_ipa }}
        run: |
          mkdir -p artifacts
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -maxdepth 2 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/${APP_NAME}.zip"
            echo "Created artifact: artifacts/${APP_NAME}.zip"
          else
            echo "No .app bundle found"
            exit 1
          fi

      - name: Prepare unsigned IPA artifact
        if: ${{ inputs.build_unsigned_ipa }}
        run: |
          mkdir -p artifacts
          ls -la artifacts/ || echo "No artifacts yet"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bite-of-now-ios-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
